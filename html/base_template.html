<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>{{title}}</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="{{description}}">
		<link rel="canonical" href="{{canonical}}">
		<t-if test="noindex"><meta name="robots" content="noindex, follow"></t-if>
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="Where in Warcraft">
		<meta property="og:title" content="{{title}}">
		<meta property="og:description" content="{{description}}">
		<meta property="og:url" content="{{canonical}}">
		<meta property="og:image" content="{{site_url}}/{{cache_bust=static/images/social_embed.png}}">
		<meta property="og:image:type" content="image/png">
		<meta property="og:image:width" content="1200">
		<meta property="og:image:height" content="630">
		<meta property="og:image:alt" content="{{share_image_alt}}">
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="{{title}}">
		<meta name="twitter:description" content="{{description}}">
		<meta name="twitter:image" content="{{site_url}}/{{cache_bust=static/images/social_embed.png}}">
		<meta name="twitter:image:alt" content="{{share_image_alt}}">
		<link rel="icon" type="image/png" href="/{{cache_bust=static/favicon-96x96.png}}" sizes="96x96">
		<link rel="icon" type="image/svg+xml" href="/{{cache_bust=static/favicon.svg}}">
		<link rel="shortcut icon" href="/{{cache_bust=static/favicon.ico}}">
		<link rel="apple-touch-icon" sizes="180x180" href="/{{cache_bust=static/apple-touch-icon.png}}">
		<meta name="apple-mobile-web-app-title" content="W-in-W">
		<link rel="manifest" href="/{{cache_bust=static/site.webmanifest}}">
		{{json_ld}}
		<link href="/{{cache_bust=static/css/style.css}}" type="text/css" rel="stylesheet"/>
		<t-for items="stylesheets" as="stylesheet"><link href="/{{stylesheet}}" type="text/css" rel="stylesheet"/></t-for>
		{{head}}
		<t-for items="scripts" as="script"><script src="/{{script}}" type="module"></script></t-for>
		<script src="/{{cache_bust=static/js/header.js}}" type="module"></script>
		<link rel="preconnect" href="//scripts.scriptwrapper.com" crossorigin>
		<link rel="dns-prefetch" href="//scripts.scriptwrapper.com">
		<script type="text/javascript" async="async" data-noptimize="1" data-cfasync="false" src="//scripts.scriptwrapper.com/tags/bbe4182c-95a5-4d90-abbb-57cf9bbb6d7c.js"></script>
	</head>
	<body class="{{body_class}}">
		<div id="backdrop"></div>
		<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden>
			<symbol id="icon-wow" viewBox="0 0 420 420.1" fill="currentColor">
				<path d="M329.1 111.97c-9.7 9-16.7 20.11-20.8 33.31-6.2 25-28.5 151.3-28.5 159 .7 8.3 3.5 16 8.3 22.9h-68c1.4-6.21 2.1-12.5 2.1-18.71 0-11.79-10.4-66.6-10.4-66.6s-13.9 56.9-13.9 67.3c0 6.2 1.4 12.5 4.2 18h-68.7s13.2-9.7 13.2-18.7c-1.4-25.7-37.5-159.7-40.3-170.1-2.2-10.4-8.4-20.09-17.4-26.4h68.7c-1.4 7.61-2.1 15.31-2.1 23.61 2.8 30.5 22.9 115.2 22.9 115.2L211 118.97l33.4 129.11s20.1-113.9 20.1-121.5c-.7-5.61-3.5-11.11-8.3-14.61z"/>
				<path d="M383.2 91.18v-51.4c0-1.4-1.4-2.81-2.8-2.81H329c-71.5-49.29-165.9-49.29-237.4 0H40.3c-.7 0-1.4 0-2.1.7s-.7 1.4-.7 2.1v50.7c-50 72.2-50 167.31 0 239.5v50.71c0 1.4 1.4 2.79 2.8 2.79h51.4c72.2 49.3 166.6 48.61 238.8-.7h50.7c1.4 0 2.8-1.4 2.8-3.5v-50.7c23.5-33.99 36-75.6 36-117.99s-13.2-84-36.8-119.4M209.7 392.47c-50.35 0-95.82-20.3-128.71-53.18C48.1 306.4 27.8 260.93 27.8 210.58c0-100.7 81.2-181.9 181.9-181.9s181.9 81.2 181.9 181.9-81.2 181.89-181.9 181.89"/>
			</symbol>
		</svg>
		<div id="layout">
			<header id="site-header">
				<div id="header-container">
					<a href="/"><img id="header-logo" src="/{{cache_bust=static/images/wiw_footer_logo.svg}}" alt="Where in Warcraft?"></a>
					<div id="header-user">
						<a id="header-leaderboards" class="btn btn-compact" href="/leaderboard"><span id="header-leaderboards-prefix">Global </span>Leaderboards</a>
						<a id="header-login" class="btn btn-compact btn-bnet" href="/auth/login" hidden>
							<img class="header-bnet-icon" src="/{{cache_bust=static/images/logo-battlenet.svg}}" alt="">
							<span>Login with Battle.net</span>
						</a>
						<div id="header-account" hidden>
							<button id="header-account-button" class="btn btn-compact btn-bnet" type="button" aria-expanded="false">
								<img class="header-bnet-icon" src="/{{cache_bust=static/images/logo-battlenet.svg}}" alt="">
								<span id="header-account-name"></span>
								<span id="header-account-caret">▾</span>
							</button>
							<div id="header-account-menu" class="dropdown" hidden>
								<a id="header-profile" href="/profile">Profile</a>
								<button id="header-logout" type="button">Logout</button>
							</div>
						</div>
					</div>
				</div>
			</header>
			{{content}}
			<footer id="site-footer">
				<div id="footer-container">
					<div id="footer-left">
						<a id="footer-logo-link" href="/"><img id="footer-logo" src="/{{cache_bust=static/images/wiw_footer_logo.svg}}" alt="Where in Warcraft?"></a>
						<div id="footer-credits">
							Created by <a href="http://kruithne.net/">Kruithne</a> and <a href="https://www.welshcorgileague.org/corgi-rescue/">Falerian</a>.<br>
							Inspired by <a href="https://geoguessr.com/">geoguessr</a>.
						</div>
					</div>
					<div id="footer-right">
						<div id="footer-support">
							Enjoyed playing? Consider <a href="https://www.paypal.me/kruithne">donating</a> or <a href="https://www.patreon.com/kruithne">supporting on Patreon</a>!
						</div>
						<div id="footer-links">
							<a href="/leaderboard">Leaderboards</a>
							<a href="/privacy">Privacy Policy</a>
						</div>
					</div>
				</div>
			</footer>
		</div>
	</body>
</html>
