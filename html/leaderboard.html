			<main id="page-content">
				<h1>{{leaderboard_heading}}</h1>

				<t-if test="has_game_modes">
					<nav class="leaderboard-switch" aria-label="Game mode">
						<t-for items="game_mode_links" as="link"><a class="leaderboard-mode {{link.class}}" href="{{link.href}}"><svg class="mode-icon {{link.icon}}" aria-hidden="true"><use href="#icon-wow"></use></svg><span>{{link.label}}</span></a></t-for>
					</nav>
				</t-if>

				<nav class="leaderboard-switch" aria-label="Era">
					<t-for items="era_links" as="link"><a class="leaderboard-mode {{link.class}}" href="{{link.href}}"><svg class="mode-icon {{link.icon}}" aria-hidden="true"><use href="#icon-wow"></use></svg><span>{{link.label}}</span></a></t-for>
				</nav>

				<p>{{leaderboard_intro}}</p>

				<t-if test="has_entries">
					<table id="leaderboard-table">
						<thead>
							<tr>
								<th scope="col">Rank</th>
								<th scope="col">Player</th>
								<th scope="col">Score</th>
								<th scope="col">Accuracy</th>
							</tr>
						</thead>
						<tbody>
							<t-for items="entries" as="entry"><tr><td>{{entry.rank}}</td><td>{{entry.name}}</td><td>{{entry.score}}</td><td>{{entry.accuracy}}%</td></tr></t-for>
						</tbody>
					</table>
				</t-if>

				<t-if test="is_empty">
					<p>No scores yet. <a href="/">Play a game</a> and be the first!</p>
				</t-if>

				<p><a href="/">Play Where in Warcraft</a> to get your name on the board.</p>
			</main>
